<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Object-oriented JavaScript example</title>
    <style>
      <section>
        <ul></ul>   
      </section>
    </style> 
  </head>
  <body>
    <p>This example requires you to enter commands in your browser's JavaScript console (see <a href="https://developer.mozilla.org/en-US/docs/Learn/Common_questions/What_are_browser_developer_tools">What are browser developer tools</a> for more information).</p>
    <input type="text" name="input-value" id="input-value" value="Type Molecule">
    <button>Add</button> 
    <script>
      const molecule = {
        name: {
            cat: "PFAS", 
            abbrv: "PFOA", 
            iupac: "pentaflurooctanoic acid"
        },
          mw: 414.069,
          description: function() {
            console.log(`${this.name[0]} molecule, ${this.name[1]}, is ${this.mw} g/mol.`);
          },

          altName: function() {
            console.log(`The full name for ${this.name[1]} is ${this.name[2]}.`);
          },
        };

      const button = document.querySelector("button")
      button.addEventListener("click", (e) => {
        e.preventDefault;
        if (e) {
          const inputValue = document.getElementById("input-value").value
          molecule["new"] = inputValue 
        } 
      });

      function createMolecule(name) {
        const obj = {};
        obj.name = name;
        obj.display = function () {
          console.log("${this.name}"); 
        };
        return obj; 
      }

    </script>
    </body>

</html>
