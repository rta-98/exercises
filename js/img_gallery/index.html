<!DOCTYPE html> 
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>Molecules!</title>
      <link href="css/styles.css" rel="stylesheet"/>
  </head>
  <body> 
    <h1 class=title>Molecular Image Gallery</h1>
    <section class="gallery">
      <div class="row"> 
        <div class="gallery-filter">
          <span class="filter-item active" data-group="all">Display All</span> 
          <span class="filter-item" data-group="fasa">FASA</span> 
          <span class="filter-item" data-group="pfca">PFCA</span> 
          <span class="filter-item" data-group="fts">FTS</span> 
          <span class="filter-item" data-group="ftca">FTCA</span> 
          <span class="filter-item" data-group="mefasaa">MeFASAA</span> 
          <span class="filter-item" data-group="ftoh">FTOH</span> 
          <span class="filter-item" data-group="pfsa">PFSA</span> 
          <span class="filter-item" data-group="pfeca">PFECA</span> 
        </div>
      </div> 
    </section>
      <section class="img-gallery">
        <div class="all-pngs"></div>
        <img src="png/co.png"> 
      </section>
    <script src="js/main.js"></script> 
  </body>
</html>
